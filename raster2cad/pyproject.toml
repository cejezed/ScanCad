[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "raster2cad"
version = "0.1.0"
description = "LLM-first hybrid vectorization engine for architectural drawings"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Raster2CAD Contributors"}
]
keywords = [
    "cad",
    "vectorization",
    "computer-vision",
    "dxf",
    "architecture",
    "llm",
    "machine-learning"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Scientific/Engineering",
]

dependencies = [
    "ezdxf>=1.3.0",
    "opencv-python>=4.8.0",
    "numpy>=1.24.0",
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pdf2image>=1.16.0",
    "PyPDF2>=3.0.0",
    "requests>=2.31.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0",
    "isort>=5.12.0",
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
]
pdf = [
    "pdf2image>=1.16.0",
    "PyPDF2>=3.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/raster2cad"
Documentation = "https://github.com/yourusername/raster2cad/blob/main/README.md"
Repository = "https://github.com/yourusername/raster2cad.git"
Issues = "https://github.com/yourusername/raster2cad/issues"

[project.scripts]
raster2cad = "cli.raster2cad:main"

[tool.setuptools]
packages = ["app", "cli", "blocks"]

[tool.black]
line-length = 100
target-version = ['py39']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
